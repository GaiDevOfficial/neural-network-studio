name: Feature request
description: Propose a capability or improvement for Node Studio.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Node Studio prefers real, verifiable behaviour over decorative placeholders.
        Explain the user problem and how the result can be measured.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can a user not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Describe the workflow, block names and expected result.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How should this be verified?
      description: Which real engine path, DOM contract or export parity check would prove it works?
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the roadmap.
          required: true
        - label: This request does not rely on a mocked metric or fake progress state.
          required: true
